name: bare-expo Android arm64 build (maestro-runner local debugging)

# Builds bare-expo's release APK for arm64-v8a (the bench builds x86_64 for
# the CI emulator), to run the e2e flows on a physical arm64 device.

on:
  push:
    branches: [maestro-runner-arm64-build]
  workflow_dispatch:

jobs:
  android-arm64-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=4096m"
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 🧹 Cleanup GitHub Linux runner disk space
        uses: ./.github/actions/cleanup-linux-disk-space
      - name: 🏗️ Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.x
      - name: 🔨 Use JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: ➕ Add `bin` to GITHUB_PATH
        run: echo "$(pwd)/bin" >> $GITHUB_PATH
      - name: 🔨 Install pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - name: 🔨 Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: 📦 Install node modules
        run: pnpm install --frozen-lockfile
      - name: 🏗️ Build Android release (bare-expo, arm64-v8a)
        working-directory: apps/bare-expo
        env:
          EXPO_DEBUG: 1
          NODE_ENV: production
          EXPO_ROUTER_DISABLE_RN_NAVIGATION_CHECK: 1
        run: ./scripts/start-android-e2e-test.ts --build
      - name: 📦 Upload the APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bare-expo-android-arm64
          path: apps/bare-expo/android/app/build/outputs/apk/release
