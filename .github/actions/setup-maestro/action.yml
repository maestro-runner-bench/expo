name: Setup Maestro
description: Install a pinned Maestro CLI version, verifying the install and retrying on transient download failures.
inputs:
  version:
    description: The Maestro CLI version to install
    required: true
runs:
  using: composite
  steps:
    - name: 🍺 Install Maestro
      shell: bash
      run: |
        # maestro-runner instead of Maestro: same flows, same command line.
        # It is installed under ~/.maestro/bin as `maestro`, where the e2e
        # scripts call it. The version input (Maestro's) is not used.
        curl -fsSL https://open.devicelab.dev/install/maestro-runner | bash -s -- --version 1.1.28.1
        mkdir -p "$HOME/.maestro/bin"
        ln -sf "$HOME/.maestro-runner/bin/maestro-runner" "$HOME/.maestro/bin/maestro"
        "$HOME/.maestro/bin/maestro" --version
        echo "${HOME}/.maestro/bin" >> $GITHUB_PATH
